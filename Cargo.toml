[package]
name = "light-dns"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
arc-swap = "1.9.3"
async-trait = "0.1.92"
hickory-proto = "0.26.3"
hickory-server = { version = "0.26.3", default-features = false, features = ["resolver"] }
moka = { version = "0.12.16", default-features = false, features = ["future"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "signal", "fs"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
