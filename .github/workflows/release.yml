name: Alpine ARM64 release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existant (vX.Y.Z) à reconstruire en brouillon'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: alpine-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: Install validated ShellCheck version
        run: |
          curl --proto '=https' --tlsv1.2 -fSL --retry 3 --connect-timeout 20 --max-time 120 https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/shellcheck.tar.xz"
          printf '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  %s\n' "$RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo check --locked
      - run: shellcheck packaging/alpine/install.sh scripts/setup-release-tools.sh scripts/package-release.sh
      - run: sh -n packaging/alpine/light-dns.initd
      - run: python3 -m unittest discover -s tests/packaging -v

  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - name: Validate version
        env:
          REQUESTED_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          tag="${REQUESTED_TAG:-v$version}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$tag" != "v$version" ]]; then
            echo 'Tag invalide ou différent de la version Cargo' >&2
            exit 1
          fi
          printf 'RELEASE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
      - run: rustup toolchain install 1.99.1 --profile minimal --target aarch64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y build-essential binutils
      - name: Install pinned cross-compilation tools
        run: |
          sh scripts/setup-release-tools.sh "$RUNNER_TEMP/release-tools"
          printf '%s\n' "$RUNNER_TEMP/release-tools/cargo-zigbuild" "$RUNNER_TEMP/release-tools/zig" "$RUNNER_TEMP/release-tools/cmake/bin" >> "$GITHUB_PATH"
      - run: cargo zigbuild --release --locked --target aarch64-unknown-linux-musl
        env:
          RUSTFLAGS: -Dwarnings
      - run: sh scripts/package-release.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: alpine-arm64
          path: |
            target/release-assets/*.tar.gz
            target/release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  draft:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: alpine-arm64
          path: target/release-assets
      - name: Create or update draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          (cd target/release-assets && sha256sum -c SHA256SUMS)
          printf 'Alpine Linux aarch64, binaire musl statique.\n\nCommit : %s\n\nValidation sur Raspberry Pi 5 par le mainteneur requise avant publication. Voir INSTALL.md dans le fichier tar.gz.\n' "$(git rev-parse HEAD)" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["isDraft"] else "Refus de modifier une release publiée")' "$RUNNER_TEMP/release.json"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" target/release-assets/*.tar.gz target/release-assets/SHA256SUMS --clobber
