name: Alpine ARM64 release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existant (vX.Y.Z ou préversion) à construire et publier'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: alpine-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake jq
      - name: Install validated ShellCheck version
        run: |
          curl --proto '=https' --tlsv1.2 -fSL --retry 3 --connect-timeout 20 --max-time 120 https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/shellcheck.tar.xz"
          printf '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  %s\n' "$RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo check --locked
      - run: shellcheck packaging/alpine/bootstrap.sh packaging/alpine/install.sh scripts/setup-release-tools.sh scripts/package-release.sh
      - run: sh -n packaging/alpine/light-dns.initd

  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --target aarch64-unknown-linux-musl,x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y build-essential binutils jq
      - name: Validate version
        env:
          REQUESTED_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          version=$(jq -er '.packages[] | select(.name == "light-dns") | .version' <<< "$metadata")
          tag="${REQUESTED_TAG:-v$version}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || [[ "$tag" != "v$version" ]]; then
            echo 'Tag invalide ou différent de la version Cargo' >&2
            exit 1
          fi
          printf 'RELEASE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
      - name: Install pinned cross-compilation tools
        run: |
          sh scripts/setup-release-tools.sh "$RUNNER_TEMP/release-tools"
          printf '%s\n' "$RUNNER_TEMP/release-tools/cargo-zigbuild" "$RUNNER_TEMP/release-tools/zig" "$RUNNER_TEMP/release-tools/cmake/bin" >> "$GITHUB_PATH"
      - run: cargo zigbuild --release --locked --target aarch64-unknown-linux-musl --target x86_64-unknown-linux-musl
        env:
          RUSTFLAGS: -Dwarnings
      - name: Validate OpenRC on Alpine AMD64 (no ARM execution)
        run: cargo test --locked --test integration alpine_openrc -- --ignored
      - run: sh scripts/package-release.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: alpine-arm64
          path: |
            target/release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: alpine-arm64
          path: target/release-assets
      - name: Upload verified assets and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          (cd target/release-assets && sha256sum -c SHA256SUMS)
          api="https://api.github.com/repos/$GH_REPO/releases"
          auth="Authorization: Bearer $GH_TOKEN"
          status=$(curl --proto '=https' --tlsv1.2 -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' -H "$auth" "$api/tags/$TAG")
          if [ "$status" = 200 ]; then
            jq -e '.draft == true' "$RUNNER_TEMP/release.json" >/dev/null || { echo 'Refus de modifier une release publiée' >&2; exit 1; }
          elif [ "$status" = 404 ]; then
            jq -n --arg tag "$TAG" --rawfile notes docs/release-notes.md '{tag_name:$tag,name:$tag,body:$notes,draft:true,prerelease:($tag|contains("-")),make_latest:"false"}' > "$RUNNER_TEMP/payload.json"
            curl --proto '=https' --tlsv1.2 -fsS -H "$auth" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/payload.json" "$api" > "$RUNNER_TEMP/release.json"
          else
            echo "Lecture de la release impossible : HTTP $status" >&2; exit 1
          fi
          id=$(jq -er '.id' "$RUNNER_TEMP/release.json")
          for file in target/release-assets/*; do
            name=${file##*/}
            existing=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' "$RUNNER_TEMP/release.json")
            if [ -n "$existing" ]; then
              curl --proto '=https' --tlsv1.2 -fsS -X DELETE -H "$auth" "$api/assets/$existing"
            fi
            curl --proto '=https' --tlsv1.2 -fsS -H "$auth" -H 'Content-Type: application/octet-stream' --data-binary "@$file" "https://uploads.github.com/repos/$GH_REPO/releases/$id/assets?name=$name" > /dev/null
          done
          jq -n --arg tag "$TAG" --rawfile notes docs/release-notes.md '{draft:false,prerelease:($tag|contains("-")),make_latest:"false",body:$notes}' > "$RUNNER_TEMP/publish.json"
          curl --proto '=https' --tlsv1.2 -fsS -X PATCH -H "$auth" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/publish.json" "$api/$id" > /dev/null
