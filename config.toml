# Configuration chargée depuis le répertoire de travail.
# Après modification : light-dns reload. Un changement d'écoute demande un redémarrage.
# Administration locale : light-dns cache clear / light-dns stats.
# Serveur DNS UDP et TCP sur la même adresse.
[dns]
# IP et port obligatoires (1 à 65535). IPv6 : "[::1]:1053".
# Pour toutes les interfaces : "0.0.0.0:1053" ou "[::]:1053".
listen = "127.0.0.1:1053"
# Au moins une IP explicite ; noms d'hôtes, adresses non spécifiées,
# multicast et broadcast IPv4 global interdits. IPv6 : "[::1]:53".
upstreams = ["1.1.1.1:53"]
# Facultatif : 2000 ms par défaut, de 1 à 60000 ms par upstream,
# repli TCP compris. L'upstream suivant est essayé en cas d'échec.
upstream_timeout_ms = 2000

# Section obligatoire, éventuellement vide. Noms ASCII ou punycode ;
# point final facultatif et casse ignorée. Les doublons normalisés sont refusés.
# Une seule IP sans port par règle : IPv4 pour A, IPv6 pour AAAA. TTL local : 60 s.
# Un type absent répond NOERROR sans enregistrement, sans forwarding.
# Seul le wildcard initial "*." est accepté. Les noms exacts sont prioritaires.
# Un wildcard couvre les descendants, pas son apex ; un nom existant plus précis
# bloque les wildcards plus généraux (ex. child.router.lan répond NXDOMAIN).
# Les zones wildcard, apex inclus, ne sont jamais transmises aux upstreams.
[rewrites]
"*.home.arpa" = "192.168.1.10"
# Règle exacte prioritaire sur *.lan.
"router.lan" = "192.168.1.1"
# Ce nom répond en AAAA ; une requête A reçoit une réponse vide, sans repli wildcard.
"nas6.lan" = "fd00::20"

# Cache des réponses upstream, actif même si cette section est absente.
# Rewrites et filtres restent prioritaires sur le cache.
[cache]
enabled = true
max_entries = 4096 # De 1 à 65536 ; éviction des entrées excédentaires.
# Budget pondéré estimé, pas une limite stricte de RAM du processus.
max_memory_bytes = 8388608 # 8 Mio ; de 65536 à 1073741824 octets.
# Durée de conservation plafonnée, sans prolonger les TTL upstream.
max_ttl_secs = 86400 # De 1 à 604800 secondes.

# Filtrage DNS actif par défaut, même si cette section est absente.
[filtering]
enabled = true
# Fichiers locaux facultatifs, relatifs au répertoire de travail.
blocklists = [] # Exemple : ["filters/block.txt"]
allowlist_files = [] # Exemple : ["filters/allow.txt"]
# Exceptions explicites prioritaires, domaine et sous-domaines inclus.
allowlist = [] # Exemple : ["safe.example.com"]
# Cache des listes distantes : répertoire dédié, accessible en écriture.
cache_dir = "data/filters"
update_interval_secs = 86400 # Relecture des fichiers et mise à jour distante : 24 h.
download_timeout_secs = 15
max_list_bytes = 8388608 # 8 Mio par liste ; maximum configurable : 16 Mio.

# Les fichiers locaux configurés autorisent les rewrites de listes.
# Sources distantes : famille $dnsrewrite interdite par défaut, cache disque compris.
# Autorisation explicite par source : allow_dnsrewrite = true exige HTTPS.
# Sources classiques adaptées au DNS. Remplacer ce tableau pour choisir ses listes.
# sources = [] désactive les téléchargements ; enabled = false désactive tout filtrage.
[[filtering.sources]]
name = "adguard-dns"
allow_dnsrewrite = false
url = "https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt"

[[filtering.sources]]
name = "peter-lowe"
allow_dnsrewrite = false
url = "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext"

# Alternatives facultatives : tous les blocs ci-dessous sont désactivés.
# Pour en choisir une, décommenter ses trois lignes [[...]], name et url.
# HaGeZi et OISD sont des agrégateurs : préférer un seul profil principal
# plutôt que de cumuler toutes les listes. Les deux sources actives ci-dessus
# peuvent alors être commentées. Respecter les limites de taille et de nombre de règles.

# HaGeZi Light : profil léger, risque de perturbations minimal selon son éditeur.
# [[filtering.sources]]
# name = "hagezi-light"
# url = "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/light.txt"

# HaGeZi Normal : couverture plus large. Choisir Light OU Normal.
# [[filtering.sources]]
# name = "hagezi-normal"
# url = "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/multi.txt"

# OISD Small : principalement publicités, format Adblock DNS.
